{% extends "base.html" %}
{% block title %}Two-factor authentication · {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Two-factor authentication</h1>
  <p>Enter the 6-digit code from your authenticator app, or a recovery code.</p>
  {% if error %}<p class="flash err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/2fa" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Code
      <input name="code" autocomplete="one-time-code" required maxlength="64" autofocus>
    </label>
    <button type="submit">Verify</button>
  </form>
</section>
{% endblock %}
