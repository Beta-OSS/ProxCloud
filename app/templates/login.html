{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in to {{ app_name }}</h1>
  <p>Use your portal account to manage your virtual machines.</p>

  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" required maxlength="64" autofocus>
    </label>
    <label class="field">Password
      <input type="password" name="password" autocomplete="current-password" required maxlength="1024">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
</section>
{% endblock %}
